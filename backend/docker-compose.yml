version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: agriconnect_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: agriconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: agriconnect_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/agriconnect
      - SECRET_KEY=agriconnect-secret-key-super-secure-production-ready-2026
      - ENVIRONMENT=production
    depends_on:
      - postgres
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
